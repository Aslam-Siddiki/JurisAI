services:
  # JurisAI Web API & Frontend Unified Service
  - type: web
    name: jurisai-web
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set in Render Dashboard with your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false # Set to your deployed AI service URL (or leave blank to use resilient built-in evaluator)
      - key: AI_SERVICE_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    healthCheckPath: /api/health

  # JurisAI Python AI Pipeline Service (Optional Dedicated Microservice)
  - type: web
    name: jurisai-ai
    env: python
    plan: free
    region: oregon
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SERVICE_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_API_KEY
        sync: false
    healthCheckPath: /health
